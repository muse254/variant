[package]
name = "variant"
version = "0.1.1"
edition = "2024"
authors = ["Osoro Bironga <fanosoro@gmail.com>"]
description = "A command line tool to help you switch git profiles seamlessly"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
home = "0.5"
inquire = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
